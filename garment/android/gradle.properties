# Project-wide Gradle settings.

# Memory settings (raised so the release build doesn't run out of Metaspace)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.daemon.idletimeout=60000
org.gradle.workers.max=2
org.gradle.parallel=false

# AndroidX
android.useAndroidX=true

# Architectures to build (32-bit + 64-bit phones; skips emulator-only x86)
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# New Architecture
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Edge-to-edge display
edgeToEdgeEnabled=false

# Release signing
MYAPP_UPLOAD_STORE_FILE=my-release-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=vijay@30
MYAPP_UPLOAD_KEY_PASSWORD=vijay@30