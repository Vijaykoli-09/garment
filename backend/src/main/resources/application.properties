# =============================================================================
# Garment backend - application.properties
# =============================================================================

# ── Database (PostgreSQL on Render) ──────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# spring.datasource.url=jdbc:postgresql://dpg-d6gmiehdrdic73c9sqjg-a.oregon-postgres.render.com:5432/garment?sslmode=require
# spring.datasource.username=garment_user
# spring.datasource.password=LsRMRhxRZ9xKSp3BoUloakGT68jfuyqh
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP connection pool ─────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
# CHANGED: 10000 -> 30000 (remote DB in Oregon, high latency)
spring.datasource.hikari.connection-timeout=30000
# CHANGED: 20000 -> 60000 (fixes the "Apparent connection leak" warning at startup)
spring.datasource.hikari.leak-detection-threshold=60000
# NEW: keeps Render from silently dropping idle connections
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.idle-timeout=300000

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.hibernate.ddl-auto=update
# Once your tables exist, "validate" makes startup faster and safer:
# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ── Logging ──────────────────────────────────────────────────────────────────
# Production-safe defaults to reduce CPU (was 25-30% with DEBUG + show-sql).
# Use profile 'dev' locally for DEBUG and SQL logging: -Dspring.profiles.active=dev
logging.level.root=WARN
logging.level.org.springframework.security=WARN

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
# server.port=8080
server.address=0.0.0.0
server.tomcat.threads.max=30

